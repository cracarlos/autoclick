name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynput pyinstaller

      - name: Build exe with PyInstaller
        run: python -m PyInstaller --noconfirm --clean AutoClick.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\AutoClick.iss"

      - name: Verify artifacts
        run: |
          Get-Item "dist\AutoClick.exe" | Select-Object FullName, Length
          Get-Item "installer\Output\AutoClickSetup.exe" | Select-Object FullName, Length

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: AutoClick-windows-exe
          path: dist\AutoClick.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoClick-windows-setup
          path: installer\Output\AutoClickSetup.exe